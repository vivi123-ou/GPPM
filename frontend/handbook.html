<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tài liệu kỹ thuật — TestPilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="/vendor/tailwind.js"></script>
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js"></script>
  <script src="/vendor/marked.min.js"></script>
  <script defer src="/vendor/alpine.min.js"></script>
</head>
<body x-data="handbook()" x-init="init()">
  <div id="tp-nav"></div>
  <main class="wrap py-10 grid lg:grid-cols-12 gap-10">
    <aside class="lg:col-span-3">
      <div class="lg:sticky lg:top-20">
        <div class="cmt">// tài liệu kỹ thuật</div>
        <nav class="rows mt-4">
          <template x-for="d in docs" :key="d.file">
            <a class="row block text-[15px] font-medium tracking-tight" :class="current === d.file && 'on'" :href="'#' + d.file" x-text="d.title"></a>
          </template>
        </nav>
        <p class="small mt-4">Tài liệu API tương tác: <a class="link" href="/docs" target="_blank">Swagger</a></p>
      </div>
    </aside>
    <!-- Nội dung là các file markdown của chính dự án trong docs/handbook, không phải dữ liệu người dùng -->
    <article class="lg:col-span-9 handbook max-w-3xl" x-html="html" data-testid="handbook-body"></article>
  </main>
  <div id="tp-status"></div>
<script>
function handbook() {
  return {
    docs: [
      {file: '01-tong-quan.md', title: 'Tổng quan và kiến trúc'},
      {file: '02-huong-dan.md', title: 'Hướng dẫn sử dụng'},
      {file: '03-dom-locator.md', title: 'DOM, locator, self-healing'},
      {file: '04-autopilot.md', title: 'Autopilot'},
      {file: '05-agents-skills.md', title: 'Agents và skills'},
      {file: '06-bao-mat.md', title: 'Bảo mật'},
      {file: '07-chat-luong.md', title: 'Đo chất lượng'},
      {file: '08-bao-tri.md', title: 'Bảo trì kịch bản'},
      {file: '09-api.md', title: 'Tham chiếu API và schema'},
      {file: '10-van-hanh.md', title: 'Cài đặt và xử lý sự cố'},
    ],
    current: '', html: '',
    async init() {
      window.addEventListener('hashchange', () => this.show());
      await this.show();
    },
    async show() {
      const want = location.hash.slice(1);
      this.current = this.docs.some(d => d.file === want) ? want : this.docs[0].file;
      const r = await fetch('/handbook-files/' + this.current);
      this.html = r.ok ? marked.parse(await r.text()) : '<p>Không đọc được tài liệu.</p>';
      window.scrollTo(0, 0);
    },
  };
}
</script>
</body>
</html>
